<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/lit/fonts.css"><script src="/lit/stage-kit.js"></script>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#101820;font-family:Archivo,Pretendard}
#jar{position:absolute;left:600px;top:300px;width:600px;height:500px;border-radius:40px;background:#3a4a5a}
#label{position:absolute;left:4px;top:40px;font-size:30px;color:#445566;opacity:0}
h1{position:absolute;left:300px;top:120px;margin:0;font-size:80px;font-weight:700;color:#f4f1ea}</style></head>
<body><div id="jar"></div><span id="label">honey 1924</span><h1 id="h"></h1><script>
const COPY = { h: '작은 병 하나' };
document.getElementById('h').textContent = COPY.h;
LitStage.text(document.getElementById('label'), { decor: true });
LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 6, render(t) {
  document.getElementById('label').style.opacity = t > 1 && t < 1.3 ? 1 : 0.95 * (t > 3 ? 1 : 0);
}});
</script></body></html>
