<!doctype html><html><head><meta charset="utf-8"><script src="/lit/stage-kit.js"></script><script src="/lit/clips.js"></script>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}#stage{position:absolute;inset:0}</style></head>
<body><div id="stage"></div>
<script>
const show = LitStage.overlay({ parent: document.getElementById('stage'), id: 'swatch', box: { x: 600, y: 300, w: 400, h: 300 } });
LitStage.define({ width: 1920, height: 1080, fps: 60, duration: 4, render(t) {
  const wrap = show(t, { start: 1.0, hold: true });
  if (wrap) wrap.style.opacity = t < 1.5 ? 1 : 0;
}});
</script></body></html>
