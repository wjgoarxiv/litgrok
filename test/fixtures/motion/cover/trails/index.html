<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #000; } canvas { position: absolute; inset: 0; width: 1200px; height: 600px; }</style>
<body>
<canvas id="c" width="2400" height="1200"></canvas>
<script>
// Keeps state between frames: the canvas is never cleared, so every frame carries the trail of
// the frames drawn before it. Captured in order it repeats exactly; sought out of order it does not.
const ctx = document.getElementById('c').getContext('2d');
ctx.scale(2, 2);
window.renderFrame = (t) => {
  ctx.fillStyle = '#4fc3f7';
  ctx.beginPath();
  ctx.arc(110 + 980 * t, 300, 28, 0, Math.PI * 2);
  ctx.fill();
};
window.ready = true;
</script>
</body>
