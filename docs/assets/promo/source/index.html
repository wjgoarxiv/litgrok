<!--
  LitGrok promo film, set in Pretendard 400 and 700; MesloLGS NF only for what a terminal prints.
  Copy lives in COPY below. LANG picks the English or the Korean lines; the Korean film is the same
  page with LANG = "ko" and the matching treatment file.
-->
<style>
  :root { --bg:#07090d; --cream:#f2efdf; --orange:#ff6337; --lime:#d7f75b; --dim:#66645b; --muted:#a19e92; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; font-synthesis:none; }
  #cv { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .abs { position:absolute; }
  .hl { position:absolute; margin:0; font:700 156px/1.04 "Pretendard", sans-serif; letter-spacing:-0.03em; color:var(--cream); white-space:nowrap; }
  .hl.ko { font-size:128px; letter-spacing:0; line-height:1.14; }

  .hl .in { display:block; }
  .hl b { font-weight:700; color:var(--orange); }
  .mono { font-family:"MesloLGS NF", monospace; white-space:pre; }
  .word { position:absolute; top:420px; margin:0; font:700 116px/1.1 "Pretendard", sans-serif; letter-spacing:-0.02em; color:var(--dim); white-space:nowrap; }
  .word.ko { letter-spacing:0; font-size:136px; top:410px; }
  #p1 { position:absolute; left:140px; top:704px; width:820px; height:96px; box-sizing:border-box; border-radius:22px; background:#10161c; border:2px solid rgba(242,239,223,.34); }
  #p1 i, #p2 i { position:absolute; top:16px; width:11px; height:11px; border-radius:6px; background:#3a3f45; }
  #p1text { position:absolute; left:34px; top:26px; font:400 34px/44px "MesloLGS NF", monospace; color:var(--cream); white-space:pre; }
  #p1text .o { color:var(--orange); }
  #caret1 { position:absolute; top:30px; width:19px; height:38px; background:var(--orange); }
  #act { position:absolute; left:140px; top:820px; height:56px; width:820px; overflow:hidden; }
  #actrow { position:absolute; left:0; top:0; font:400 36px/56px "MesloLGS NF", monospace; white-space:pre; color:var(--cream); }

  #card-in { position:absolute; left:970px; top:220px; width:810px; height:400px; }
  #card-in .cr { position:absolute; left:44px; width:722px; height:100px; }
  #card-in .cr .lb { position:absolute; left:92px; top:0; font:400 52px/80px "MesloLGS NF", monospace; color:var(--cream); white-space:pre; }
  #card-in .cr .hr { position:absolute; left:0; top:100px; width:722px; height:2px; background:rgba(242,239,223,.14); }
  #card-in .cr svg { position:absolute; left:0; top:10px; width:60px; height:60px; overflow:visible; }
  #p2 { position:absolute; left:970px; top:710px; width:810px; height:200px; box-sizing:border-box; border-radius:24px; background:#10161c; border:2px solid rgba(242,239,223,.34); overflow:hidden; }
  #p2text { position:absolute; left:34px; top:100px; font:400 42px/56px "MesloLGS NF", monospace; color:var(--cream); white-space:pre; }
  #p2text .o { color:var(--orange); }
  #caret2 { position:absolute; top:106px; width:24px; height:44px; background:var(--orange); }

  #pill { position:absolute; top:910px; height:68px; padding:0 30px; border-radius:18px; border:2px solid rgba(242,239,223,.28); box-sizing:border-box; font:400 30px/64px "MesloLGS NF", monospace; color:var(--cream); white-space:pre; }
  #pill .o { color:var(--orange); }
  svg { overflow:visible; }

<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="heads"></div>
  <div id="words"></div>
  <div id="p1"><i style="left:22px"></i><i style="left:40px"></i><i style="left:58px"></i><div id="p1text"></div><div id="caret1"></div></div>
  <div id="act"><div id="actrow"></div></div>
  <div id="bar-in"><div class="rowline" id="rowidle"></div><div class="rowline" id="rowact"></div></div>
  <div id="card-in">
    <div id="crs"></div>
  </div>
  <div id="p2"><i style="left:22px"></i><i style="left:40px"></i><i style="left:58px"></i><div id="p2text"></div><div id="caret2"></div></div>
  <p id="sub"></p>
  <div id="pill"></div>
</div>

<script>
const LANG = "en";
if (LANG === "ko") document.body.style.wordBreak = "keep-all";
const COPY = {
  en: {
    h1: ["Start with", "<b>a line.</b>"],
    words: ["Plan", "Build", "Verify", "Hand off"],
    h3: ["See what is <b>lit.</b>"],
    h4: ["Leave the", "<b>next step.</b>"],
    h5: ["Keep the", "work <b>lit.</b>"],
    sub: "For Grok Build",
  },
  ko: {
    h1: ["한 줄로", "<b>시작하세요.</b>"],
    words: ["계획", "구현", "검증", "인계"],
    h3: ["<b>켜진 것</b>을 확인하세요."],
    h4: ["다음 할 일을", "<b>남기세요.</b>"],
    h5: ["Keep the", "work <b>lit.</b>"],
    sub: "Grok Build용",
  },
}[LANG];
// What the terminals, the row and the card print in the film: strings taken from the README, the hooks and the skills.
const TERM = {
  prompt: "/litwork Make a to-do list",
  act: "LIT IGNITED · litwork",
  idle: "LIT · grok │ grok-4 │ ctx 42%",
  active: "LIT IGNITED · litwork",
  tail: " │ grok-4 │ ctx 42%",
  rows: ["Built", "Checked", "Remains"],
  pane: "Pick up where we left off.",
  cmd: "npm exec --yes --package @litfamily/litgrok@latest -- litgrok install",
};

const L = LitStage;
const { define, text, ease, at, kf, lerp, clamp, mix, rgba } = L;
const W = 1920, H = 1080, DUR = 22;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const C = { bg: "#07090d", cream: "#f2efdf", orange: "#ff6337", lime: "#d7f75b", dim: "#66645b", unlit: "#22262d" };
const E = ease;
const cv = $("cv"); const g = cv.getContext("2d", { willReadFrequently: true });
const setVis = (el, on) => { el.style.visibility = on ? "visible" : "hidden"; };
const P = (t, t0, d, e) => at(t, t0, d, e || E.outCubic);
const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return v * v * v * p0 + 3 * v * v * u * p1 + 3 * v * u * u * p2 + u * u * u * p3; };
const rgb = (c, a) => rgba(c, a);

/* ---------- the mark: quadrant cells drawn to an offscreen canvas ---------- */
const QUAD = { "█": [0, 1, 2, 3], "▀": [0, 1], "▄": [2, 3], "▌": [0, 2], "▐": [1, 3], "▖": [2], "▗": [3], "▘": [0], "▝": [1], "▙": [0, 2, 3], "▛": [0, 1, 2], "▜": [0, 1, 3], "▟": [1, 2, 3], "▚": [0, 3], "▞": [1, 2] };
const BASE = { O: "#ff6337", L: "#d7f75b", I: "#f2efdf" };
const CELLS = []; const DOTC = [];
MARK_ROWS.forEach((row, r) => {
  Array.from(row).forEach((ch, c) => {
    const q = QUAD[ch]; if (!q) return;
    const key = MARK_KEYS[r][c];
    q.forEach((bit) => {
      const cell = { x: c * 18 + (bit & 1 ? 9 : 0), y: r * 36 + (bit & 2 ? 18 : 0), base: BASE[key] || BASE.I, dot: key === "L" && r < 4, d: 0 };
      CELLS.push(cell); if (cell.dot) DOTC.push(cell);
    });
  });
});
// The dot of the mark: centre and radius in mark space.
const DOT = { x: DOTC.reduce((s, c) => s + c.x + 4.5, 0) / DOTC.length, y: DOTC.reduce((s, c) => s + c.y + 9, 0) / DOTC.length };
let dmax = 1;
CELLS.forEach((c) => { c.d = Math.hypot(c.x + 4.5 - DOT.x, (c.y + 9 - DOT.y) * 0.55); dmax = Math.max(dmax, c.d); });
CELLS.forEach((c) => { c.d /= dmax; });
const off = document.createElement("canvas"); off.width = 792; off.height = 720;
const octx = off.getContext("2d", { willReadFrequently: true });
function drawMark(x, y, s, f, dotAmt, alpha) {
  octx.clearRect(0, 0, 792, 720);
  for (let i = 0; i < CELLS.length; i++) {
    const c = CELLS[i];
    let k = clamp((f - c.d) / 0.45, 0, 1);
    const hot = k > 0 && k < 1 ? Math.sin(k * Math.PI) : 0;
    let col;
    if (c.dot) { col = mix(C.unlit, c.base, dotAmt); if (dotAmt > 0.01) col = mix(col, "#fff6d8", hot * 0.1); }
    else col = mix(C.unlit, c.base, E.outCubic(k));
    octx.fillStyle = col;
    octx.fillRect(c.x, c.y, 9, 18);
  }
  g.save(); g.globalAlpha = alpha;
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(off, x, y, 792 * s, 720 * s);
  g.restore();
}
function glow(cx, cy, r, a, col) {
  if (a <= 0.003) return;
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0, rgb(col, a)); gr.addColorStop(0.5, rgb(col, a * 0.32)); gr.addColorStop(1, rgb(col, 0));
  g.fillStyle = gr; g.fillRect(cx - r, cy - r, r * 2, r * 2);
}
function spark(x, y, r, a) {
  if (a <= 0.004) return;
  glow(x, y, r * 4.4, a * 0.85, C.lime);
  g.fillStyle = rgb("#f4ffcc", a); g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
}
function trail(posAt, t, r, a) {
  for (let i = 9; i >= 1; i--) { const p = posAt(t - i * 0.024); spark(p[0], p[1], r * (1 - i / 11), a * (1 - i / 10) * 0.45); }
  const p = posAt(t); spark(p[0], p[1], r, a);
}

/* ---------- embers: quiet texture ---------- */
const rnd = L.rand(2026);
const EMB = Array.from({ length: 22 }, () => ({ x: rnd() * W, y0: rnd() * (H + 200), v: 10 + rnd() * 20, r: 1.2 + rnd() * 1.8, ph: rnd() * 6.28, sw: 6 + rnd() * 16, c: rnd() < 0.2 ? C.lime : C.orange, a: 0.16 + rnd() * 0.16 }));
function embers(t, amt) {
  for (const e of EMB) {
    const y = (((e.y0 - e.v * t) % (H + 200)) + (H + 200)) % (H + 200) - 100;
    const x = e.x + Math.sin(t * 0.5 + e.ph) * e.sw;
    g.fillStyle = rgb(e.c, e.a * amt * (0.6 + 0.4 * Math.sin(t * 1.1 + e.ph)));
    g.beginPath(); g.arc(x, y, e.r, 0, 6.2832); g.fill();
  }
}

/* ---------- timeline ---------- */
const CUT = [5.6, 10.0, 14.0, 18.2];
// the mark
const M0 = { s: 1.02, x: (W - 792 * 1.02) / 2, y: (H - 720 * 1.02) / 2 };
const M1 = { s: 0.7, x: 1060, y: 214 };
const MC = { s: 0.14, x: 140, y: 68 };
const M5 = { s: 0.7, x: 140, y: 190 };
function markState(t) {
  // The big mark of beat one. It eases right, is lit by the typed line, then dissolves in place.
  let bx, by, bs;
  if (t < 1.4) { bx = M0.x; by = M0.y; bs = M0.s; }
  else { const p = E.inOutCubic(clamp((t - 1.4) / 1.1, 0, 1)); bx = lerp(M0.x, M1.x, p); by = lerp(M0.y, M1.y, p); bs = lerp(M0.s, M1.s, p); }
  const drift = P(t, 5.6, 0.9, E.outCubic);
  const bs2 = lerp(bs, 0.64, drift);
  bx += (bs - bs2) * 396; by += (bs - bs2) * 360;
  let bf = -0.5;
  if (t >= 4.15) bf = lerp(-0.5, 1.5, E.inOutSine(clamp((t - 4.15) / 1.6, 0, 1)));
  if (t >= 5.75) bf = 1.5;
  let bd = 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(t * 2.4));   // the dot breathes before the line lands
  if (t >= 4.15) bd = 1;
  const big = { x: bx, y: by, s: bs2, f: bf, dot: bd, alpha: t < 5.6 ? 1 : 1 - P(t, 5.6, 0.5, E.inOutSine) };
  // The mark in the corner: it appears as the big one dissolves, its dot leaves at 6.35 and comes home at 18.75.
  let cx, cy, cs, cf = 1.5, ca = 1;
  if (t < 18.2) { cx = MC.x; cy = MC.y; cs = MC.s * (0.86 + 0.14 * P(t, 5.9, 0.6, E.outCubic)); ca = P(t, 5.9, 0.5, E.inOutSine); }
  else {
    const p = E.inOutCubic(clamp((t - 18.2) / 0.8, 0, 1));
    cx = lerp(MC.x, M5.x, p); cy = lerp(MC.y, M5.y, p); cs = lerp(MC.s, M5.s, p);
    cf = t < 18.3 ? 1.5 : lerp(1.5, -0.5, clamp((t - 18.2) / 0.45, 0, 1));
    if (t >= 18.8) cf = lerp(-0.5, 1.5, E.inOutSine(clamp((t - 18.8) / 1.25, 0, 1)));
  }
  let cd = 1;
  if (t >= 6.35 && t < 18.7) cd = 1 - clamp((t - 6.35) / 0.15, 0, 1);
  if (t >= 18.7) cd = clamp((t - 18.7) / 0.18, 0, 1);
  return { big, corner: { x: cx, y: cy, s: cs, f: cf, dot: cd, alpha: ca } };
}
const dotPos = (m) => [m.x + DOT.x * m.s, m.y + DOT.y * m.s];

// the rail and its nodes
const RAIL = { x0: 160, x1: 1780, y: 600 };
const NX = [160, 540, 950, 1380];
const ARR = [7.1, 7.8, 8.5, 9.2];
const DEP = [7.35, 8.05, 8.75];
// the spark
function sparkPos(t) {
  if (t < 6.4) { const m = dotPos({ x: MC.x, y: MC.y, s: MC.s }); return m; }
  if (t < ARR[0]) { const u = E.inOutCubic(clamp((t - 6.4) / (ARR[0] - 6.4), 0, 1)); const a = dotPos(MC); return [bez(a[0], 90, 70, NX[0], u), bez(a[1], 260, 430, RAIL.y, u)]; }
  for (let i = 0; i < 3; i++) if (t >= DEP[i] && t < ARR[i + 1]) { const u = E.inOutCubic((t - DEP[i]) / (ARR[i + 1] - DEP[i])); return [lerp(NX[i], NX[i + 1], u), RAIL.y - Math.sin(u * Math.PI) * 26]; }
  if (t < DEP[0]) return [NX[0], RAIL.y];
  if (t < DEP[1]) return [NX[1], RAIL.y];
  if (t < DEP[2]) return [NX[2], RAIL.y];
  if (t < 10.35) return [NX[3], RAIL.y];
  // from the card to the pane
  if (t >= 15.4 && t < 16.2) { const u = E.inOutCubic(clamp((t - 15.4) / 0.8, 0, 1)); return [bez(1040, 940, 940, 1020, u), bez(520, 600, 700, 810, u)]; }
  if (t >= 16.2 && t < 18.2) return [1020, 810];
  if (t >= 18.2 && t < 18.75) { const u = E.inOutCubic(clamp((t - 18.2) / 0.55, 0, 1)); const a = dotPos(markState(18.75).corner); return [bez(1020, 900, 700, a[0], u), bez(810, 900, 300, a[1], u)]; }
  return null;
}
function sparkAlpha(t) {
  if (t < 6.35) return 0;
  if (t < 6.45) return clamp((t - 6.35) / 0.1, 0, 1);
  if (t < 9.9) return 1;
  if (t < 10.35) return 1 - clamp((t - 9.9) / 0.45, 0, 1);
  if (t < 15.35) return 0;
  if (t < 15.45) return clamp((t - 15.35) / 0.1, 0, 1);
  if (t < 18.72) return 1;
  return 1 - clamp((t - 18.72) / 0.12, 0, 1);
}

// the vessel: one rounded shape that is a rail, then a bar, then a card
const VK = [
  { t: 6.3, v: [160, 599, 0, 2, 1, 0, 0], ease: "outCubic" },
  { t: 6.9, v: [160, 599, 1620, 2, 1, 0, 0], ease: "linear" },
  { t: 10.35, v: [160, 599, 1620, 2, 1, 0, 0], ease: "inOutCubic" },
  { t: 11.25, v: [180, 590, 1560, 180, 40, 1, 1], ease: "linear" },
  { t: 14.0, v: [180, 590, 1560, 180, 40, 1, 1], ease: "inOutCubic" },
  { t: 14.9, v: [970, 220, 810, 400, 30, 1, 1], ease: "linear" },
  { t: 18.2, v: [970, 220, 810, 400, 30, 1, 1], ease: "inOutCubic" },
  { t: 18.8, v: [1375, 420, 0, 0, 2, 1, 0], ease: "linear" },
];
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r); g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r); g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r); g.closePath();
}
function drawVessel(t) {
  if (t < 6.3 || t > 18.85) return null;
  const v = kf(t, VK);
  const [x, y, w, h, r, mixp, strokeA] = v;
  if (w < 1 || h < 1) return v;
  const railCol = "#6a6a60";
  const fill = mix(railCol, "#10161c", mixp);
  g.save();
  if (t >= 18.2) g.globalAlpha = 1 - clamp((t - 18.2) / 0.6, 0, 1);
  rrect(x, y, w, h, r); g.fillStyle = fill; g.fill();
  if (strokeA > 0.01) { g.lineWidth = 2; g.strokeStyle = rgb(C.cream, 0.34 * strokeA); g.stroke(); }
  g.restore();
  return v;
}

/* ---------- DOM: headlines ---------- */
const heads = {};
function makeHead(id, lines, left, top, fs) {
  const h = document.createElement("h1");
  h.className = "hl" + (LANG === "ko" && id !== "h5" ? " ko" : "");
  h.innerHTML = lines.map((l) => `<span class="ln"><span class="in">${l}</span></span>`).join(" ");
  if (fs) h.style.fontSize = fs + "px";
  h.style.left = left + "px"; h.style.top = top + "px";
  $("heads").appendChild(h); text(h);
  heads[id] = { el: h, ins: [...h.querySelectorAll(".in")] };
}
const KO = LANG === "ko";
makeHead("h1", COPY.h1, 140, 232, KO ? 132 : 164);
makeHead("h3", COPY.h3, 140, KO ? 366 : 332, KO ? 156 : 200);
makeHead("h4", COPY.h4, 140, KO ? 368 : 372, KO ? 144 : 152);
makeHead("h5", COPY.h5, 820, 206, 176);
function head(h, tin, tout, t) {
  h.ins.forEach((el, i) => {
    if (KO) {
      const kin = P(t, tin + i * 0.1, 0.8, E.outCubic);
      const kout = tout == null ? 0 : P(t, tout + i * 0.04, 0.34, E.inOutSine);
      el.style.transform = `translateY(${(1 - kin) * 22}%)`;
      el.style.opacity = String(kin * (1 - kout));
      return;
    }
    const pin = P(t, tin + i * 0.12, 1.05, E.outQuad);
    const pout = tout == null ? 0 : P(t, tout, 0.32, E.inOutSine);
    el.style.transform = `translateY(${(1 - pin) * 112}%)`;
    el.style.opacity = String(1 - pout);
  });
  setVis(h.el, t >= tin - 0.02 && (tout == null || t <= tout + 0.6));
}

/* ---------- DOM: route words ---------- */
const WX = [160, 540, 950, 1380];
const wordEls = [];
COPY.words.forEach((wd, i) => {
  const w = document.createElement("div"); w.className = "word" + (KO ? " ko" : ""); w.style.left = WX[i] - 6 + "px"; w.textContent = wd;
  $("words").appendChild(w); text(w); wordEls.push(w);
});
function words(t) {
  wordEls.forEach((w, i) => {
    const tin = 6.5 + i * 0.1;
    const pin = P(t, tin, 0.7, E.outQuint);
    const pout = P(t, 9.75 + i * 0.04, 0.4, E.inCubic);
    const lit = P(t, ARR[i], 0.25, E.outCubic);
    const leave = i < 3 ? P(t, DEP[i], 0.45, E.inOutSine) : 0;
    let col = mix(C.dim, C.orange, lit);
    col = mix(col, C.cream, leave);
    w.style.color = col;
    w.style.opacity = String(pin * (1 - pout));
    w.style.transform = `translateY(${(1 - pin) * 30 + pout * 40}px)`;
    setVis(w, t >= tin - 0.02 && t <= 10.3);
  });
}
function drawRail(t) {
  if (t < 6.3 || t > 10.3) return;
  const a = 1 - P(t, 9.75, 0.45, E.inCubic);
  // lit part of the rail follows the spark
  const sp = sparkPos(t); const litTo = sp ? clamp(sp[0], RAIL.x0, RAIL.x1) : RAIL.x0;
  if (t >= ARR[0]) {
    g.save(); g.globalAlpha = a; g.fillStyle = C.orange; g.fillRect(RAIL.x0, RAIL.y - 1, Math.max(0, litTo - RAIL.x0), 2); g.restore();

/* ---------- DOM: the terminal pane in beat one ---------- */
const p1 = $("p1"), p1text = $("p1text"), caret1 = $("caret1");

const CH1 = 34 * 0.602;

const STOPS = [[255, 99, 55], [255, 45, 149], [0, 229, 255]];

}
const FLAME = '<svg class="flame" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1C13 6 19 9 19 17C19 22.5 15.9 27 12 27C8.1 27 5 22.5 5 17C5 13.5 6.6 11.4 8 9.6C8.6 12 9.8 13 11 13.4C10.4 9 10.8 4.6 12 1Z" fill="#ff6337"/><path d="M12 15C13.5 17 15.2 18.6 15.2 21C15.2 23.4 13.8 25 12 25C10.2 25 8.8 23.4 8.8 21C8.8 18.8 10.5 17.8 12 15Z" fill="#f2efdf"/></svg>';

TERM.rows.forEach((name, i) => {

const p2 = $("p2"), p2text = $("p2text"), caret2 = $("caret2");

/* ---------- frame ---------- */
function background(t) {

define({ width: W, height: H, fps: 60, duration: DUR, render(t) {
  const { big: mb, corner: mc } = markState(t);

  embers(t, t < 1.2 ? P(t, 0, 1.2, E.outCubic) * 0.5 : 0.5);

  drawRail(t);
  const v = drawVessel(t);
  // one soft ring when the spark is absorbed into the bar
  if (t >= 10.5 && t < 11.6) { const f = P(t, 10.5, 1.1, E.outCubic); g.save(); g.globalAlpha = 0.55 * (1 - f); rrect(180 - 40 * f, 590 - 40 * f, 1560 + 80 * f, 180 + 80 * f, 40 + 30 * f); g.lineWidth = 3; g.strokeStyle = C.orange; g.stroke(); g.restore(); }
  // the flip sweep across the bar
  if (t >= 12.3 && t < 13.1) { const f = P(t, 12.3, 0.7, E.inOutCubic); g.save(); g.globalAlpha = 0.5 * Math.sin(f * Math.PI); const x = lerp(200, 1720, f); const gr = g.createLinearGradient(x - 60, 0, x + 60, 0); gr.addColorStop(0, "rgba(255,99,55,0)"); gr.addColorStop(0.5, "rgba(255,99,55,0.5)"); gr.addColorStop(1, "rgba(255,99,55,0)"); g.fillStyle = gr; g.fillRect(x - 60, 594, 120, 172); g.restore(); }

    else spark(sp[0], sp[1], 9 + (t >= 9.9 && t < 10.35 ? 6 * P(t, 9.9, 0.45, E.outCubic) : 0), sa);
  }

  pane1(t); actLine(t);

  statusRow(t);
  head(heads.h4, 14.7, 18.2, t);

} });
