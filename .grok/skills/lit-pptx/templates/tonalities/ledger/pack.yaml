# Ledger: a quarterly review the reader studies line by line. Compact type; tables and KPI rows
# carry the argument; the accent marks the current period and one key figure.
# A poor fit for a short spoken pitch or for a briefing written as running prose.
id: ledger
name: Ledger
version: "1.0.0"
intent: "Dense, numbers-forward review decks that are read closely."
canvas: ["16:9", "4:3"]

# LitGrok bundles Pretendard Regular and Bold only: title range comes from size, colour and placement.
faces:
  display: Pretendard Bold
  title: Pretendard Bold
  body: Pretendard Regular
  label: Pretendard Regular
  numeral: Pretendard Bold

palette:
  ground: "#FFFFFF"
  surface: "#F2F4F6"
  ink: "#16212C"
  ink-muted: "#4B5866"
  line: "#D0D6DC"
  accent: "#0E6B5A"
  accent-deep: "#0A4438"
  accent-tint: "#E2F0EC"
  field: "#0A4438"
  on-field: "#FFFFFF"
  series: ["#0E6B5A", "#4B5866", "#9A6A12", "#2F5F8A"]

ramp: reading
hero: false
type-voice:
  title-tracking: -1
  display-tracking: -1

density: 10
variance: 5
radius: 0
edge: fill

treatments: [top-rule, side-rail, kicker-numeral, bottom-anchor]
role-defaults:
  content: top-rule
  data: top-rule
  data-takeaway: side-rail
  sequence: kicker-numeral
  image: bottom-anchor
  statement: side-rail
  reference: top-rule
  definition: side-rail

decoration: [accent-rule, hairline-rule, rail-fill, numeral]
layout-families: [kpi-row, kpi-over-chart, dashboard-grid, ledger-table, table-insight, chart-insight, full-chart, big-number, comparison, timeline, matrix-2x2, agenda, text-two-column, references-appendix]
# Display slides: how a type-led cover, a statement, a big number and a closing's next step are
# drawn under this pack (references/layout-families.md, "Display slides").
display:
  cover: figures
  number: tint
  closing: box
  index: true
covers: [cover-figures, cover-typographic, cover-index]
sections: [section-rule, section-numeral]
closings: [closing-decision-box, closing-ask]

table:
  # The header row is the ledger's one dark mass: deep field, white labels.
  header: field
  header-ink: on-field
  rules: header-and-totals
  banding: none
  totals: bold
chart:
  gridlines: hairline
  labels: direct
  highlight: accent-on-muted
image:
  frame: hairline

fill-order: [step-up, distribute, anchor-visual, change-family]
