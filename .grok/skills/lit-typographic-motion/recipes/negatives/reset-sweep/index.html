<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- NEGATIVE, never a recipe: a progress sweep driven like elapsed time that resets at the loop
     point, so the seam is a cut. It must keep failing the cover gate on G4. -->
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/loop-kit.js"></script>
<style>
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #080c12; color: #f1eee2; font-family: "JetBrains Mono"; }
  .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  body.mask, body.mask * { background: #000 !important; color: #000 !important; border-color: #000 !important; }
  body.mask .title { color: #fff !important; }
</style>
</head>
<body>
<div id="bar" style="position:absolute;left:0;top:0;height:600px;background:#1c2532"></div>
<div class="line title" style="top:230px;font-size:110px;font-weight:800;letter-spacing:6px">LITGROK</div>
<script>
window.renderFrame = (t, o = {}) => { document.body.className = o.mask ? 'mask' : ''; document.getElementById('bar').style.width = `${1200 * t}px`; };
document.fonts.ready.then(() => { window.ready = true; });
</script>
</body>
</html>
