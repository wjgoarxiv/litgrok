<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Recipe: orbit loop (orbit-loop), a small system beside a still word. A worked page: three rings
     at 3, 2 and 1 laps per loop (whole laps close the loop), a gate at twelve o'clock that flashes
     on every crossing, and a ledger under the word whose cells light at the crossing times (as many
     crossings as cells, so the ledger loops too). Replace NAME and the motto with the project's own. -->
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/loop-kit.js"></script>
<style>
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #070c13; }
  canvas { width: 1200px; height: 600px; display: block; }
</style>
</head>
<body>
<canvas id="c" width="2400" height="1200"></canvas>
<script>
// Slow: dashed overlays turn a quarter lap per loop, opposite ways. Mid: the core breathes once per
// loop and rings out on every bar (four per loop). Beat: each crossing flashes its gate, swells its
// dot and lights the next ledger cell, which decays over most of the loop.
const { TAU, clamp, fract, mix, ease, cubicPulse, swell } = LitLoop;
const NAME = 'LITGROK';
const INK = { ground: '#070c13', ring: '#1d2836', dash: '#2b394a', ivory: '#f1eee2', ember: '#ff6a3d', dim: '#8a9096' };
const ctx = document.getElementById('c').getContext('2d');
ctx.scale(2, 2);
const CX = 880, CY = 300, GATE = -Math.PI / 2;
const RINGS = [
  { r: 102, laps: 3, dots: 3, dir: 1, size: 5.5 },
  { r: 168, laps: 2, dots: 2, dir: -1, size: 6.5 },
  { r: 236, laps: 1, dots: 3, dir: 1, size: 7.5 },
];
// A dot k on a ring is at the gate when laps * t + k / dots is whole: these are the ledger's times.
const crossings = [];
RINGS.forEach((ring) => { for (let k = 0; k < ring.dots; k += 1) for (let lap = 0; lap < ring.laps; lap += 1) crossings.push(fract((lap + 1 - k / ring.dots) / ring.laps)); });
crossings.sort((a, b) => a - b);
const angle = (ring, k, t) => GATE + ring.dir * TAU * (ring.laps * t + k / ring.dots);

function hexagon(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i += 1) { const a = (i * TAU) / 6 + Math.PI / 6; ctx[i ? 'lineTo' : 'moveTo'](x + r * Math.cos(a), y + r * Math.sin(a)); }
  ctx.closePath();
}
function title(mask) {
  ctx.fillStyle = mask ? '#fff' : INK.ivory;
  ctx.font = '800 104px "JetBrains Mono"';
  ctx.fillText(NAME, 72, 292);
}

window.renderFrame = (t, o = {}) => {
  ctx.fillStyle = o.mask ? '#000' : INK.ground;
  ctx.fillRect(0, 0, 1200, 600);
  if (o.mask) { title(true); return; }
  RINGS.forEach((ring, i) => {
    ctx.lineWidth = 1.5; ctx.strokeStyle = INK.ring;
    ctx.beginPath(); ctx.arc(CX, CY, ring.r, 0, TAU); ctx.stroke();
    ctx.save();
    ctx.setLineDash([2, 10]);
    ctx.lineDashOffset = (i % 2 ? 1 : -1) * t * TAU * ring.r * 0.25;
    ctx.lineWidth = 3; ctx.strokeStyle = INK.dash;
    ctx.beginPath(); ctx.arc(CX, CY, ring.r + 7, 0, TAU); ctx.stroke();
    ctx.restore();
  });
  const breath = swell(fract(t + 0.15));
  const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, 92);
  glow.addColorStop(0, `rgba(255,106,61,${0.18 + 0.14 * breath})`); glow.addColorStop(1, 'rgba(255,106,61,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(CX, CY, 92, 0, TAU); ctx.fill();
  const bar = fract(4 * t);
  ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,106,61,${0.55 * (1 - ease.outCubic(bar))})`;
  hexagon(CX, CY, mix(34, 98, ease.outExpo(bar))); ctx.stroke();
  hexagon(CX, CY, 34); ctx.fillStyle = '#0d141d'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = INK.ember; ctx.stroke();
  hexagon(CX, CY, 17 + 3 * breath); ctx.fillStyle = `rgba(255,144,96,${0.55 + 0.35 * breath})`; ctx.fill();
  RINGS.forEach((ring) => {
    let hit = 0;
    for (let k = 0; k < ring.dots; k += 1) { const p = fract(ring.laps * t + k / ring.dots); hit = Math.max(hit, cubicPulse(0, 0.04, p), cubicPulse(1, 0.04, p)); }
    ctx.strokeStyle = INK.ember; ctx.globalAlpha = 0.45 + 0.55 * hit; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(CX, CY - ring.r - 12 - 10 * hit); ctx.lineTo(CX, CY - ring.r - 4); ctx.stroke();
    ctx.globalAlpha = 1;
  });
  RINGS.forEach((ring) => {
    for (let k = 0; k < ring.dots; k += 1) {
      const a = angle(ring, k, t), p = fract(ring.laps * t + k / ring.dots);
      const pulse = Math.max(cubicPulse(0, 0.035, p), cubicPulse(1, 0.035, p));
      const reach = 0.55 / ring.laps + 0.25;
      for (let s = 0; s < 14; s += 1) {
        const a0 = a - ring.dir * reach * (s / 14), a1 = a - ring.dir * reach * ((s + 1) / 14);
        ctx.strokeStyle = `rgba(241,238,226,${0.32 * (1 - s / 14) ** 1.6})`;
        ctx.lineWidth = ring.size * 0.9 * (1 - s / 16);
        ctx.beginPath(); ctx.arc(CX, CY, ring.r, Math.min(a0, a1), Math.max(a0, a1)); ctx.stroke();
      }
      const x = CX + ring.r * Math.cos(a), y = CY + ring.r * Math.sin(a);
      if (pulse > 0.01) {
        const halo = ctx.createRadialGradient(x, y, 0, x, y, 28);
        halo.addColorStop(0, `rgba(255,144,96,${0.7 * pulse})`); halo.addColorStop(1, 'rgba(255,106,61,0)');
        ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, 28, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = pulse > 0.5 ? INK.ember : INK.ivory;
      ctx.beginPath(); ctx.arc(x, y, ring.size * (1 + 0.6 * pulse), 0, TAU); ctx.fill();
    }
  });
  title(false);
  let mx = 76;
  ctx.font = '500 18px "JetBrains Mono"'; ctx.fillStyle = INK.dim;
  for (const ch of 'KEEP THE WORK ') { ctx.fillText(ch, mx, 340); mx += 19.6; }
  ctx.font = '700 18px "JetBrains Mono"'; ctx.fillStyle = INK.ember;
  for (const ch of 'LIT.') { ctx.fillText(ch, mx, 340); mx += 19.6; }
  crossings.forEach((at, i) => {
    const since = fract(t - at);
    const lit = since < 0.03 ? ease.outCubic(since / 0.03) : Math.exp(-4.2 * since);
    const x = 76 + i * 29;
    ctx.fillStyle = INK.ring; ctx.fillRect(x, 380, 22, 8);
    ctx.fillStyle = `rgba(255,106,61,${clamp(lit)})`; ctx.fillRect(x, 380, 22, 8);
  });
};
document.fonts.load('800 104px "JetBrains Mono"').then(() => document.fonts.load('500 18px "JetBrains Mono"')).then(() => { window.renderFrame(0); window.ready = true; });
</script>
</body>
</html>
